<h2 style="text-align:center;">Tic-Tac-Toe</h2>

{% if not game_started %}
  <div style="text-align:center; margin-top:50px;">
    <a href="?start=1">
      <button style="font-size:24px; padding:10px 20px;">Start Game</button>
    </a>
  </div>
{% else %}

  {% if winner %}
    <h3 style="text-align:center; color:green;">Winner: {{ winner }}</h3>
    <div style="text-align:center; margin-bottom:20px;">
      <a href="?reset=1" style="font-size:18px;">Go to Home</a>
    </div>
  {% else %}
    <h3 style="text-align:center; color:blue;">Player Turn: {{ player }}</h3>
  {% endif %}

  <table style="margin:auto; border-collapse: collapse; border:3px solid black;">
    {% for row in board %}
    <tr>
      {% for cell in row %}
      <td style="width:120px; height:120px; border:2px solid black; padding:0;">
        {% if cell %}
          <span style="font-size:64px; display:flex; align-items:center; justify-content:center; height:100%;">{{ cell }}</span>
        {% else %}
          <form method="post" style="margin:0; padding:0; height:100%; width:100%; display:flex;">
            {% csrf_token %}
            <input type="hidden" name="row" value="{{ forloop.parentloop.counter0 }}">
            <input type="hidden" name="col" value="{{ forloop.counter0 }}">
            <button type="submit" style="flex:1; font-size:48px; width:100%; height:100%;">{{ player }}</button>
          </form>
        {% endif %}
      </td>
      {% endfor %}
    </tr>
    {% endfor %}
  </table>

{% endif %}
